  hard_constraints_for_gpt:
    must:
      - "把本项目理解为可复用商业网站底座模板，而不是一次性网站工程。"
      - "优先使用 Stable Core / Variable Layer / Extension Layer 理解模块关系。"
      - "区分 foundation、shell、business content、extension module、policy / convention。"
      - "保持 Auth / Role / Permission 作为 foundation，不让其依赖业务模块。"
      - "保持 Dashboard 与 Admin 职责分离。"
      - "保持 Marketing 作为公开访问区域，不承载核心业务逻辑。"
      - "保持 Extension Slot 作为横向接入规则，不把它当作独立业务区域。"
      - "判断依赖时优先使用 graph 中的 allowed_dependencies 与 forbidden_dependencies。"

    must_not:
      - "不得把 workflow、phases、04-engineering-node-extraction-and-flow-preparation.md 纳入当前项目背景图谱。"
      - "不得把 Extension Slot 误解为一个与 Marketing / Dashboard / Admin 平级的业务区域。"
      - "不得让 Stable Core 依赖 Variable Layer 或 Extension Layer。"
      - "不得让 Dashboard 与 Admin 互相依赖业务逻辑。"
      - "不得让 Marketing 依赖 Dashboard / Admin 的业务逻辑。"
      - "不得让扩展模块修改 Stable Core。"