knowledge_file:
  id: "KB-source-distillation"
  purpose: "将当前可纳入 GPT 知识库的架构文稿压缩成便于检索的项目背景知识。"
  format_policy:
    language: "Chinese-first"
    english_usage: "仅保留路径、模块名、技术术语、固定架构术语"
    use_for:
      - "帮助 GPT 快速理解项目背景"
      - "帮助 GPT 按模块检索相关知识"
      - "帮助 GPT 在生成 specs 时保持边界一致"
    not_for:
      - "不作为施工流程图"
      - "不作为中间层 schema"
      - "不作为代码实现任务图"

project_orientation:
  project_type: "可复用商业网站底座模板"
  target_user: "外包客户 / 小型商业网站 / 可升级 lite SaaS 骨架"
  current_stage: "架构背景已足够，当前优先推进 Kiro Specs 到 tasks.md 粒度"
  fixed_tech_stack:
    - "Next.js App Router"
    - "TypeScript"
    - "Postgres"
    - "Prisma"
    - "Auth.js"
    - "Docker Compose"
    - "Caddy"
  core_areas:
    - "Marketing"
    - "Dashboard"
    - "Admin"
    - "Auth / Role / Permission"
    - "Extension Slot"
    
source_units:

  - unit_id: "project_overview"
    source_path: "docs/architecture/00-overview.md"
    title: "Template Architecture Overview"
    unit_type: "project_overview"
    retrieval_priority: "high"
    one_sentence: "定义商业网站底座模板的总体目标、覆盖范围、三层架构、主要区域、全局原则与核心风险。"
    distilled_content:
      project_goal:
        - "项目目标是为外包客户交付可复用的商业网站底座模板。"
        - "模板应支持标准化网站基础能力、客户差异化定制、未来扩展模块接入。"
        - "架构需要便于 AI 辅助生产与维护。"
      scope:
        - "用户认证与账户体系"
        - "角色与权限模型"
        - "公开访问的营销页面"
        - "用户工作空间"
        - "网站管理后台"
        - "数据库访问基础规则"
        - "部署基线配置"
        - "共享验证与约定"
        - "扩展模块接入原则"
      non_goals:
        - "不追求重型 SaaS 多租户平台。"
        - "不追求过重的 tool system 或 workflow engine。"
        - "不为未经确认的极端扩展场景做过度预设计。"
        - "不是一次性网站工程，而是可复用模板。"
        - "不为技术先进性偏离当前技术栈。"
      architecture_model:
        - "Stable Core 是模板复用基础，应尽量保持稳定。"
        - "Variable Layer 承载客户差异化内容和高频变化内容。"
        - "Extension Layer 承载可独立添加或移除的客户扩展能力。"
      major_areas:
        - "Marketing 负责公开访问的营销内容、产品展示、定价说明和注册转化。"
        - "Dashboard 负责已登录用户的个人工作空间和用户级业务功能入口。"
        - "Admin 负责网站拥有者或管理员的后台管理能力。"
        - "Auth / Role / Permission 作为 foundation，为 dashboard 和 admin 提供守卫能力。"
      principles:
        - "边界优先：先定义职责与边界，再讨论实现方式。"
        - "依赖方向稳定：Stable Core 不被上层污染。"
        - "最小闭环优先：优先保证 auth + dashboard + admin 基础能力可用。"
        - "模板复用优先：避免为单一客户过度定制。"
        - "默认规则与例外分离。"
        - "分层清晰。"
        - "AI 可读性优先。"
      risk_topics:
        - "Marketing / Dashboard / Admin 边界模糊。"
        - "扩展机制过重。"
        - "依赖方向违反。"
        - "角色与权限模型不足。"
        - "技术栈偏离。"
      open_question_topics:
        - "Role 模型粒度。"
        - "Marketing 与业务数据的边界。"
        - "Dashboard 与 Admin 的功能复用。"
    search_tags:
      - "project overview"
      - "commercial site template"
      - "Stable Core"
      - "Variable Layer"
      - "Extension Layer"
      - "Marketing"
      - "Dashboard"
      - "Admin"
      - "Auth"
      - "template reuse"

  - unit_id: "global_architecture_rules"
    source_path: "docs/architecture/01-global-rules.md"
    title: "Global Architecture Rules"
    unit_type: "upper_level_rule"
    retrieval_priority: "high"
    one_sentence: "定义跨模块通用的架构判断规则、分层规则、模块分类规则、边界表达规则和文档表达规则。"
    distilled_content:
      goal:
        - "为模板底座建立跨模块通用的全局架构规则。"
        - "提供统一架构判断标准。"
        - "保证模块设计一致性。"
        - "为后续 module design 与 spec 提供上位约束。"
      scope:
        - "三层架构判断规则。"
        - "模块分类规则。"
        - "依赖方向总规则。"
        - "边界控制总原则。"
        - "扩展接入总原则。"
        - "文档表达总规则。"
      layer_rules:
        stable_core:
          - "作为模板复用基础，跨客户保持稳定。"
          - "修改时影响多个模块或整体架构。"
          - "提供基础能力，被其他层依赖。"
          - "不因客户差异化需求频繁变化。"
        variable_layer:
          - "按客户需求高频变化。"
          - "可替换或可调整。"
          - "承载客户差异化内容。"
          - "不应反向破坏 Stable Core。"
        extension_layer:
          - "可独立添加或移除。"
          - "不强制所有客户使用。"
          - "不修改 Stable Core。"
          - "按客户需求接入。"
      module_class_rules:
        foundation:
          - "提供基础能力接口。"
          - "不承载业务逻辑。"
          - "被其他模块依赖。"
          - "保持稳定。"
          - "可提供扩展点，但不预设具体业务策略。"
        shell:
          - "提供路由外壳、布局框架、守卫机制。"
          - "不嵌入具体业务逻辑。"
          - "结构稳定，允许样式调整。"
          - "提供扩展接入点。"
        business_content:
          - "承载具体业务功能或业务数据。"
          - "按客户需求变化。"
          - "可替换或调整。"
        extension_module:
          - "可独立添加或移除。"
          - "不修改 Stable Core。"
          - "遵守扩展接入原则。"
        policy_convention:
          - "定义规则或约定。"
          - "不提供具体实现。"
          - "跨模块通用。"
      boundary_rules:
        - "每个模块必须明确职责、非职责、对外依赖、被依赖关系。"
        - "Foundation 停留在能力接口层。"
        - "Shell 停留在框架层。"
        - "Business content 停留在业务实现层。"
        - "Extension module 停留在扩展实现层。"
        - "描述模块边界时必须区分 default behavior、allowed exception、forbidden behavior。"
      extension_rules:
        - "扩展模块默认主要接入 dashboard 或 admin。"
        - "如确有需要，marketing 只承载轻量展示型或转化型集成。"
        - "扩展机制应保持简单，避免提前建设重型系统。"
      documentation_rules:
        - "中文为主，仅保留关键词、技术术语、路径、文件名和代码标识符为英文。"
        - "模块文档优先包含 Goal、Scope、Non-Goals、Module Position、Responsibilities、Boundaries、Dependency Direction、Default / Exception / Forbidden、Relationship、Risks、Open Questions、Suggested Next Step。"
        - "架构草案停留在 architecture / design 层，不进入 implementation。"
      risk_topics:
        - "规则过于抽象。"
        - "规则过于具体。"
        - "规则冲突。"
        - "规则遗漏。"
    search_tags:
      - "global rules"
      - "layer rules"
      - "module classification"
      - "foundation"
      - "shell"
      - "business content"
      - "extension module"
      - "boundary rules"
      - "documentation rules"

  - unit_id: "testing_strategy"
    source_path: "docs/architecture/02-testing-strategy.md"
    title: "Testing Strategy"
    unit_type: "validation_rule"
    retrieval_priority: "medium"
    one_sentence: "定义项目在架构文稿阶段、Spec 阶段、实现阶段和回归阶段的验证策略。"
    distilled_content:
      goal:
        - "保证 Stable Core 的稳定性与可复用性。"
        - "验证架构边界与依赖方向的正确性。"
        - "支持客户差异化定制同时保持核心质量。"
        - "为 GPT 审核、Spec 使用、Codex 执行提供统一验证口径。"
      scope:
        - "测试目标与验证原则。"
        - "分层测试优先级。"
        - "模块类型测试优先级。"
        - "分阶段验证策略。"
        - "回归测试策略。"
        - "风险控制原则。"
      principles:
        - "稳定性优先：Stable Core 的验证优先级最高。"
        - "边界验证：验证职责边界、权限检查、依赖方向。"
        - "最小闭环：优先验证 auth + dashboard + admin 基础能力。"
        - "模板复用验证：确保客户定制不污染模板底座。"
        - "AI 可执行：测试用例结构化、可审核、可自动执行。"
      layer_testing_focus:
        stable_core:
          - "Foundation 接口稳定性。"
          - "Shell 守卫机制。"
          - "依赖方向正确性。"
          - "边界清晰性。"
        variable_layer:
          - "业务逻辑正确性。"
          - "业务内容不违反架构边界。"
          - "业务内容不绕过 foundation 或 shell。"
        extension_layer:
          - "扩展模块不破坏 Stable Core。"
          - "扩展模块遵守接入原则。"
          - "扩展模块可独立添加或移除。"
      stage_validation:
        architecture_stage:
          - "验证三层划分。"
          - "验证模块分类。"
          - "验证依赖方向。"
          - "验证职责边界。"
          - "识别风险与 Open Questions。"
        spec_stage:
          - "验证 requirements 是否明确范围与边界。"
          - "验证 design 是否符合架构约束。"
          - "验证 tasks 是否可验证、可闭环。"
          - "验证是否遗漏关键依赖。"
        implementation_stage:
          - "验证实现是否符合 Spec。"
          - "验证实现是否符合架构约束。"
          - "验证权限检查是否完整。"
          - "验证测试覆盖是否达标。"
      minimal_loop_priority:
        - "Auth foundation 基础能力。"
        - "Role / Permission foundation 基础能力。"
        - "Dashboard shell 守卫机制。"
        - "Admin shell 守卫机制。"
        - "用户注册、登录、访问 dashboard 等关键路径。"
      regression_strategy:
        - "Stable Core 修改触发完整回归测试。"
        - "Foundation 接口修改触发完整回归测试。"
        - "Shell 守卫机制修改触发完整回归测试。"
        - "Variable Layer 修改可触发局部回归。"
        - "Extension module 修改应触发隔离测试与集成测试。"
      risk_topics:
        - "测试覆盖不足。"
        - "测试过度。"
        - "架构测试缺失。"
        - "回归测试不完整。"
        - "测试与架构文稿不一致。"
    search_tags:
      - "testing strategy"
      - "validation"
      - "spec stage"
      - "implementation stage"
      - "regression"
      - "minimal loop"
      - "Stable Core testing"

  - unit_id: "architecture_glossary"
    source_path: "docs/architecture/03-glossary.md"
    title: "Architecture Glossary"
    unit_type: "terminology_rule"
    retrieval_priority: "high"
    one_sentence: "统一项目核心架构术语，防止 GPT 在模块、层级、边界和职责判断中出现概念漂移。"
    distilled_content:
      goal:
        - "统一当前项目中的核心架构术语。"
        - "明确每个术语在本项目中的固定含义。"
        - "区分容易混淆的概念。"
        - "为 module design、Spec、GPT 审核、Codex 执行提供统一语言基础。"
      core_terms:
        stable_core: "作为模板复用基础、跨客户保持稳定、不因客户差异化需求频繁变化的部分。"
        variable_layer: "按客户需求高频变化、可替换或可调整、不影响 Stable Core 的部分。"
        extension_layer: "可独立添加或移除、不强制所有客户使用、不修改 Stable Core 的部分。"
        foundation: "提供基础能力接口、不承载业务逻辑、被其他模块依赖、不依赖业务模块的层。"
        shell: "提供路由外壳、布局框架、守卫机制、扩展接入点，但不嵌入具体业务逻辑的层。"
        business_content: "承载具体业务功能或业务数据、按客户需求变化、依赖 foundation 和 shell 的层。"
        extension_module: "可独立添加或移除、不修改 Stable Core、遵守扩展接入原则的模块。"
        policy_convention: "定义规则或约定、不提供具体实现、跨模块通用的内容。"
        marketing: "承载公开访问的营销内容、不以用户登录状态为核心前提、不承载核心业务逻辑的区域。"
        dashboard: "为已登录用户提供个人工作空间、承载用户级业务功能、可接入扩展模块的区域。"
        admin: "为网站拥有者或管理员提供后台管理能力的区域。"
        auth_role_permission: "提供认证机制、角色模型、权限检查规则、为 dashboard 和 admin 提供守卫能力的 foundation。"
        extension_slot: "定义扩展模块接入原则的横向规则，不是独立区域，不与 marketing / dashboard / admin 平级。"
      distinction_rules:
        foundation_vs_shell:
          - "Foundation 提供能力接口。"
          - "Shell 提供路由外壳与守卫机制。"
        shell_vs_business_content:
          - "Shell 提供框架与守卫。"
          - "Business content 承载具体业务逻辑。"
        business_content_vs_extension_module:
          - "Business content 是模板的一部分。"
          - "Extension module 是客户按需接入的增量。"
        dashboard_vs_admin:
          - "Dashboard 面向已登录用户工作空间。"
          - "Admin 面向管理员后台管理能力。"
        marketing_vs_dashboard:
          - "Marketing 承载公开内容。"
          - "Dashboard 承载需要登录的业务功能。"
        extension_slot_vs_extension_module:
          - "Extension slot 是接入原则。"
          - "Extension module 是具体扩展实现。"
        light_dependency_vs_strong_dependency:
          - "轻度依赖是可选使用部分能力。"
          - "强依赖是核心功能必须依赖。"
      naming_preferences:
        - "Foundation 层模块可使用 `<capability>-foundation`。"
        - "Shell 层模块可使用 `<area>-shell`。"
        - "Business content 可使用 `<area>-content` 或 `<area>-business`。"
        - "模块设计文件使用 `modules/<module-name>.md`。"
      expression_preferences:
        - "使用“在本项目中指”明确项目特定含义。"
        - "使用“典型示例”辅助理解。"
        - "使用“不是”区分易混概念。"
        - "避免无依据的模糊表达。"
    search_tags:
      - "glossary"
      - "terminology"
      - "Stable Core"
      - "Foundation"
      - "Shell"
      - "Business Content"
      - "Extension Slot"
      - "Dashboard vs Admin"
      - "Marketing vs Dashboard"

