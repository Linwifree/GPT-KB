system_facts:
  file_identity:
    id: "leader-work-summary-template"
    name: "Leader Work Summary Template"
    owner_role: "Leader-GPT"
    use_stage: "before_commitLeaderArtifacts"
    purpose: "定义 commitLeaderArtifacts.leader_work_summary_json 的严格 JSON object 结构、字段语义和生成约束。"

  artifact_identity:
    action_field: "leader_work_summary_json"
    format: "JSON object"
    submitted_via: "commitLeaderArtifacts"
    stored_by_gateway_as: "leader-work-summary.json"

  scope_boundary:
    owns:
      - "leader_work_summary_json 的 required fields。"
      - "leader_work_summary_json 的 JSON schema 对齐。"
      - "action 与 expected_action 的一致性。"
      - "file_change.type 与 action 的配对关系。"
      - "file_change.target_file 的 canonical target_file 语义。"
      - "boundary / dependencies / memory_note 的最小语义摘要。"

    out_of_scope:
      - "task_packet_md 的 Markdown 正文结构。"
      - "review_intent_pack_md 的 Markdown 正文结构。"
      - "commitLeaderArtifacts requestBody 的整体字段形态。"
      - "target_file 的路径族选择策略。"

leader_work_summary_json_schema:
  type: "object"
  additionalProperties: false

  required:
    - "schema_version"
    - "action"
    - "file_change"
    - "main_goal"
    - "behavior"
    - "boundary"
    - "dependencies"
    - "memory_note"

  properties:
    schema_version:
      type: "string"
      enum:
        - "1.0"
      meaning: "leader_work_summary_json 的 schema 版本。"

    action:
      type: "string"
      enum:
        - "Create"
        - "MajorRevision"
      source_of_truth: "getLeaderContext.expected_action"
      meaning:
        Create: "本轮生成新目标或推进下一轮目标。"
        MajorRevision: "本轮围绕返工包生成大修返工任务。"
      required_alignment:
        - "值等于 getLeaderContext.expected_action。"

    file_change:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "target_file"
      properties:
        type:
          type: "string"
          enum:
            - "new_file"
            - "major_revision"
          meaning: "本轮目标文件变化类型。"

        target_file:
          type: "string"
          meaning: "本轮唯一 canonical target_file。"

      required_alignment:
        - "target_file 是单一 string。"
        - "target_file 与 task_packet_md 中的 Target File 一致。"
        - "target_file 与 review_intent_pack_md 中的 Review Target 一致。"

    main_goal:
      type: "string"
      minLength: 1
      meaning: "本轮核心目标的一句话或短段摘要。"
      content_guidance:
        - "说明本轮选择该 target_file 的主要原因。"
        - "说明本轮要推动的结果。"
        - "保持摘要级表达。"

    behavior:
      type: "object"
      additionalProperties: false
      required:
        - "task_type"
        - "operation"
      properties:
        task_type:
          type: "string"
          meaning: "本轮任务类型。"
          examples:
            - "spec_generation"
            - "spec_revision"
            - "knowledge_file_generation"
            - "knowledge_file_revision"

        operation:
          type: "string"
          meaning: "本轮操作类型。"
          examples:
            - "create_target_file_task"
            - "major_revision_task"
            - "continue_next_target_task"

    boundary:
      type: "object"
      additionalProperties: false
      required:
        - "in_scope"
        - "out_of_scope"
      properties:
        in_scope:
          type: "array"
          items:
            type: "string"
          meaning: "本轮范围内事项。"

        out_of_scope:
          type: "array"
          items:
            type: "string"
          meaning: "本轮范围外事项。"

      content_guidance:
        - "保持简短。"
        - "与 task_packet_md 的 Scope Boundary 保持语义一致。"

    dependencies:
      type: "object"
      additionalProperties: false
      required:
        - "modules"
        - "files"
      properties:
        modules:
          type: "array"
          items:
            type: "string"
          meaning: "本轮相关模块名或知识域名。"

        files:
          type: "array"
          items:
            type: "string"
          meaning: "本轮相关依据文件路径。"

      content_guidance:
        - "只列本轮真正相关的模块和文件。"
        - "保持为摘要级依赖，不替代 Reading Scope。"

    memory_note:
      type: "object"
      additionalProperties: false
      required:
        - "summary"
        - "carry_forward"
      properties:
        summary:
          type: "string"
          minLength: 1
          meaning: "给后续轮次使用的本轮简短进展摘要。"

        carry_forward:
          type: "array"
          items:
            type: "string"
          meaning: "需要带到后续轮次的注意事项。"

      content_guidance:
        - "只写本轮对后续决策有帮助的语义摘要。"
        - "避免重复 task_packet_md 全文。"

action_pairing_policy:
  source_of_truth:
    - "getLeaderContext.expected_action"

  when_expected_action_is_Create:
    required_alignment:
      - "leader_work_summary_json.action = Create"
      - "leader_work_summary_json.file_change.type = new_file"
    expected_meaning:
      - "target_file 指向本轮新建或继续推进的目标文件。"

  when_expected_action_is_MajorRevision:
    required_alignment:
      - "leader_work_summary_json.action = MajorRevision"
      - "leader_work_summary_json.file_change.type = major_revision"
    expected_meaning:
      - "target_file 优先沿用返工目标文件。"

target_file_policy:
  meaning:
    - "target_file 是本轮唯一 canonical target_file。"
    - "target_file 是三产物目标路径对齐的主事实。"

  schema_shape:
    type: "string"

  required_alignment:
    - "与 task_packet_md 中的 Target File 一致。"
    - "与 review_intent_pack_md 中的 Review Target 一致。"

  path_policy_note:
    - "target_file 的可用路径族不在本文件展开。"
    - "target_file 的路径族选择由路径地图与 target_file 选择策略承接。"
    - "本文件只规定 target_file 的 JSON schema 形态与 canonical 语义。"

commit_payload_position:
  leader_work_summary_json:
    required_shape:
      - "作为 commitLeaderArtifacts requestBody 的 leader_work_summary_json 字段值提交。"
      - "字段值是 JSON object。"
      - "字段值符合 leader_work_summary_json_schema。"
      - "字段集合与 schema required / properties 对齐。"

schema_acceptance_summary:
  strictly_required:
    - "leader_work_summary_json 是 object。"
    - "包含全部 required 字段。"
    - "字段集合不超出 schema properties。"
    - "schema_version = 1.0。"
    - "action 属于 Create 或 MajorRevision。"
    - "file_change.type 属于 new_file 或 major_revision。"
    - "file_change.target_file 是 string。"
    - "main_goal 非空。"
    - "behavior.task_type 存在。"
    - "behavior.operation 存在。"
    - "boundary.in_scope 是 string[]。"
    - "boundary.out_of_scope 是 string[]。"
    - "dependencies.modules 是 string[]。"
    - "dependencies.files 是 string[]。"
    - "memory_note.summary 非空。"
    - "memory_note.carry_forward 是 string[]。"

valid_minimal_example:
  schema_version: "1.0"
  action: "Create"
  file_change:
    type: "new_file"
    target_file: "docs/example.md"
  main_goal: "生成本轮目标文件的任务规划。"
  behavior:
    task_type: "spec_generation"
    operation: "create_target_file_task"
  boundary:
    in_scope:
      - "生成本轮目标文件相关任务包与审查意图。"
      - "保持本轮唯一 target_file 边界。"
    out_of_scope:
      - "本轮 target_file 之外的扩展工作。"
      - "实现代码。"
  dependencies:
    modules:
      - "example"
    files:
      - "current-specs-completion-direction.yaml"
      - "kiro-specs-definition.yaml"
      - "KB-source-distillation.yaml"
      - "KB-module-knowledge-graph.yaml"
  memory_note:
    summary: "本轮选择 docs/example.md 作为目标文件。"
    carry_forward:
      - "后续继续保持单一 target_file。"