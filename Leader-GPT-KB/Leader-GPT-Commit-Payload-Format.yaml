system_facts:
  file_identity:
    id: "leader-gpt-commit-payload-format"
    name: "Leader-GPT Commit Payload Format"
    owner_role: "Leader-GPT"
    use_stage: "before_commitLeaderArtifacts"
    purpose: "定义 commitLeaderArtifacts requestBody 的合法字段形态。"

  scope_boundary:
    owns:
      - "commitLeaderArtifacts requestBody 的整体 schema。"
      - "requestBody 的三个顶层字段。"
      - "task_packet_md 的 Gateway schema 字段形态。"
      - "review_intent_pack_md 的 Gateway schema 字段形态。"
      - "leader_work_summary_json 的 Gateway schema 字段形态。"
      - "三个产物之间的 canonical target_file / action 对齐关系。"

    out_of_scope:
      - "task_packet_md 的 Markdown 章节语义。"
      - "review_intent_pack_md 的 Markdown 章节语义。"
      - "leader_work_summary_json 的字段语义细节。"
      - "提交前检查流程。"
      - "target_file 选择策略。"
      - "项目背景、模块边界或 Spec 生产顺序。"

source_contracts:
  task_packet_template: "KiroPrompt-GPT-Task-Packet-Template.md"
  review_intent_template: "Review-Intent-Packet-Template.md"
  work_summary_template: "Leader-Work-Summary-Template.yaml"

commit_payload_schema:
  name: "CommitLeaderArtifactsRequest"
  type: "object"
  additionalProperties: false

  required:
    - "task_packet_md"
    - "review_intent_pack_md"
    - "leader_work_summary_json"

  properties:
    task_packet_md:
      type: "string"
      minLength: 1
      artifact_role: "KiroPrompt-GPT task packet Markdown body"
      content_source: "KiroPrompt-GPT-Task-Packet-Template.md"

    review_intent_pack_md:
      type: "string"
      minLength: 1
      artifact_role: "Review-GPT review intent Markdown body"
      content_source: "Review-Intent-Packet-Template.md"

    leader_work_summary_json:
      type: "object"
      schema_ref: "LeaderWorkSummary"
      schema_source: "Leader-Work-Summary-Template.yaml"

  exact_top_level_fields:
    - "task_packet_md"
    - "review_intent_pack_md"
    - "leader_work_summary_json"

field_value_shape:
  task_packet_md:
    gateway_schema:
      type: "string"
      minLength: 1
      cleaned_value: "non_empty"
    document_quality:
      source: "KiroPrompt-GPT-Task-Packet-Template.md"
      expected_identity:
        first_line: "# KiroPrompt-GPT Task Packet"
      expected_shape:
        - "字段值是任务包 Markdown 正文。"
        - "字段值保留可阅读的 Markdown 换行。"
        - "字段值中的 Target File 与 canonical target_file 一致。"

  review_intent_pack_md:
    gateway_schema:
      type: "string"
      minLength: 1
      cleaned_value: "non_empty"
    document_quality:
      source: "Review-Intent-Packet-Template.md"
      expected_identity:
        first_line: "# Review Intent Packet"
      expected_shape:
        - "字段值是审查意图 Markdown 正文。"
        - "字段值保留可阅读的 Markdown 换行。"
        - "字段值中的 Review Target 与 canonical target_file 一致。"

  leader_work_summary_json:
    gateway_schema:
      type: "object"
      schema_ref: "LeaderWorkSummary"
      schema_source: "Leader-Work-Summary-Template.yaml"
    source_of_truth_for:
      - "target_file"
      - "action"
      - "file_change.type"
      - "dependencies"
      - "memory_note"

gateway_cleaning_expectation:
  markdown_fields:
    - "task_packet_md"
    - "review_intent_pack_md"

  accepted_after_cleaning:
    - "字段存在。"
    - "字段值是 string。"
    - "清洗后字段值非空。"

  cleaning_notes:
    - "换行可被统一。"
    - "首尾空白可被清理。"
    - "整体外层 Markdown 代码块可被清理。"
    - "清理后仍以非空 string 进入后续保存。"

leader_work_summary_schema_ref:
  schema_name: "LeaderWorkSummary"
  source_file: "Leader-Work-Summary-Template.yaml"
  required:
    - "schema_version"
    - "action"
    - "file_change"
    - "main_goal"
    - "behavior"
    - "boundary"
    - "dependencies"
    - "memory_note"

  strict_shape:
    type: "object"
    additionalProperties: false

canonical_values:
  target_file:
    source: "leader_work_summary_json.file_change.target_file"
    mirrored_in:
      - "task_packet_md.Target File"
      - "review_intent_pack_md.Review Target"

  action:
    source: "leader_work_summary_json.action"
    mirrored_in:
      - "task_packet_md.Expected Action"
      - "review_intent_pack_md.Expected Action"

  file_change_type:
    source: "leader_work_summary_json.file_change.type"

action_pairing:
  Create:
    file_change_type: "new_file"

  MajorRevision:
    file_change_type: "major_revision"

alignment_contract:
  required:
    - "requestBody 使用 commit_payload_schema。"
    - "requestBody 顶层字段集合等于 exact_top_level_fields。"
    - "task_packet_md 是非空 string。"
    - "review_intent_pack_md 是非空 string。"
    - "leader_work_summary_json 是 object。"
    - "leader_work_summary_json 符合 Leader-Work-Summary-Template.yaml。"
    - "canonical target_file 来自 leader_work_summary_json.file_change.target_file。"
    - "task_packet_md.Target File 与 canonical target_file 一致。"
    - "review_intent_pack_md.Review Target 与 canonical target_file 一致。"
    - "leader_work_summary_json.file_change.type 与 leader_work_summary_json.action 配对一致。"

valid_payload_shape:
  request_body:
    task_packet_md: |
      # KiroPrompt-GPT Task Packet

      ## 1. Task Header
      - Task Title:
      - Mode:
      - Input Type:
      - Expected Action:

    review_intent_pack_md: |
      # Review Intent Packet

      ## 1. Review Header
      - Mode:
      - Input Type:
      - Expected Action:

    leader_work_summary_json:
      schema_version: "1.0"
      action: "Create"
      file_change:
        type: "new_file"
        target_file: "docs/example.md"
      main_goal: "生成本轮目标文件的任务规划。"
      behavior:
        task_type: "spec_generation"
        operation: "create_target_file_task"
      boundary:
        in_scope:
          - "生成本轮目标文件相关任务包与审查意图。"
          - "保持本轮唯一 target_file 边界。"
        out_of_scope:
          - "本轮 target_file 之外的扩展工作。"
          - "实现代码。"
      dependencies:
        modules:
          - "example"
        files:
          - "current-specs-completion-direction.yaml"
          - "kiro-specs-definition.yaml"
          - "KB-source-distillation.yaml"
          - "KB-module-knowledge-graph.yaml"
      memory_note:
        summary: "本轮选择 docs/example.md 作为目标文件。"
        carry_forward:
          - "后续继续保持单一 target_file。"