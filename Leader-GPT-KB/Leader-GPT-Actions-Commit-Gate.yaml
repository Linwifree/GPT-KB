system_facts:
  file_identity:
    id: "leader-gpt-actions-commit-gate"
    name: "Leader-GPT Actions Commit Gate"
    owner_role: "Leader-GPT"
    use_stage: "before_commitLeaderArtifacts"
    purpose: "定义 Leader-GPT 调用 commitLeaderArtifacts 前的提交体自检规则。"

  role_scope:
    owns:
      - "读取提交体格式规范作为 requestBody schema 来源。"
      - "确认本轮已获得 Gateway context。"
      - "确认 requestBody 符合 CommitLeaderArtifactsRequest。"
      - "确认 task_packet_md 满足 Gateway 对 Markdown 字段的最低检测。"
      - "确认 review_intent_pack_md 满足 Gateway 对 Markdown 字段的最低检测。"
      - "确认 leader_work_summary_json 符合 LeaderWorkSummary。"
      - "确认 action 与 expected_action 一致。"
      - "确认三个产物围绕同一个 canonical target_file。"

    out_of_scope:
      - "选择本轮 target_file。"
      - "生成 task_packet_md 正文。"
      - "生成 review_intent_pack_md 正文。"
      - "生成 leader_work_summary_json 字段内容。"
      - "定义提交体字段形态。"
      - "定义 Markdown 正文的章节语义。"

source_contracts:
  gateway_contract: "Leader-GPT-Actions-Gateway-Contract.md"
  commit_payload_format: "Leader-GPT-Commit-Payload-Format.yaml"
  task_packet_template: "KiroPrompt-GPT-Task-Packet-Template.md"
  review_intent_template: "Review-Intent-Packet-Template.md"
  work_summary_template: "Leader-Work-Summary-Template.yaml"

commit_gate_contract:
  required_context_fields:
    - "mode"
    - "input_type"
    - "expected_action"
    - "context.current_state"
    - "context.current_input_md"
    - "context.optional_context"

  mode_values:
    - "first-round"
    - "received-summary"
    - "rework"

  expected_action_values:
    - "Create"
    - "MajorRevision"

  request_body_schema:
    source: "Leader-GPT-Commit-Payload-Format.yaml.commit_payload_schema"
    type: "object"
    additionalProperties: false
    required:
      - "task_packet_md"
      - "review_intent_pack_md"
      - "leader_work_summary_json"

  canonical_values:
    source: "Leader-GPT-Commit-Payload-Format.yaml.canonical_values"
    target_file: "leader_work_summary_json.file_change.target_file"
    action: "leader_work_summary_json.action"
    file_change_type: "leader_work_summary_json.file_change.type"

  mode_action_pairs:
    first-round:
      expected_action: "Create"
      file_change_type: "new_file"

    received-summary:
      expected_action: "Create"
      file_change_type: "new_file"

    rework:
      expected_action: "MajorRevision"
      file_change_type: "major_revision"

check_groups:
  context_alignment_check:
    required:
      - "getLeaderContext 返回值已获得。"
      - "mode 来自 getLeaderContext.mode。"
      - "input_type 来自 getLeaderContext.input_type。"
      - "expected_action 来自 getLeaderContext.expected_action。"

    pass_when:
      - "required_context_fields 全部可用。"
      - "mode 属于 mode_values。"
      - "expected_action 属于 expected_action_values。"

    repair_when:
      - "Gateway context 缺项。"
      - "mode 值未进入 mode_values。"
      - "expected_action 值未进入 expected_action_values。"

  commit_payload_schema_check:
    required:
      - "requestBody 是 object。"
      - "requestBody 顶层字段集合等于 commit_payload_format.commit_payload_schema.required。"
      - "requestBody 符合 additionalProperties=false。"
      - "task_packet_md 字段存在。"
      - "review_intent_pack_md 字段存在。"
      - "leader_work_summary_json 字段存在。"

    pass_when:
      - "requestBody 符合 CommitLeaderArtifactsRequest。"
      - "requestBody 只包含 task_packet_md、review_intent_pack_md、leader_work_summary_json。"

    repair_when:
      - "requestBody 不是 object。"
      - "requestBody 顶层字段集合与 CommitLeaderArtifactsRequest 不一致。"

  markdown_gateway_schema_check:
    required:
      - "task_packet_md 是 string。"
      - "task_packet_md 清洗后非空。"
      - "review_intent_pack_md 是 string。"
      - "review_intent_pack_md 清洗后非空。"

    pass_when:
      - "task_packet_md 满足 commit_payload_format.field_value_shape.task_packet_md.gateway_schema。"
      - "review_intent_pack_md 满足 commit_payload_format.field_value_shape.review_intent_pack_md.gateway_schema。"

    repair_when:
      - "task_packet_md 字段值无法作为非空 string。"
      - "review_intent_pack_md 字段值无法作为非空 string。"

  markdown_template_quality_check:
    required:
      - "task_packet_md 使用 KiroPrompt-GPT-Task-Packet-Template.md 定义的正文结构。"
      - "review_intent_pack_md 使用 Review-Intent-Packet-Template.md 定义的正文结构。"
      - "task_packet_md 的 Target File 与 canonical target_file 一致。"
      - "review_intent_pack_md 的 Review Target 与 canonical target_file 一致。"
      - "两个 Markdown 正文中的 Expected Action 与 canonical action 一致。"

    pass_when:
      - "两个 Markdown 字段满足 Gateway 最低检测。"
      - "两个 Markdown 字段同时满足各自模板质量要求。"

    repair_when:
      - "Markdown 字段通过 Gateway schema，但模板质量未对齐。"
      - "Markdown 正文中的目标路径或 Expected Action 与 canonical values 不一致。"

  leader_work_summary_schema_check:
    required:
      - "leader_work_summary_json 是 object。"
      - "leader_work_summary_json 符合 Leader-Work-Summary-Template.yaml。"
      - "leader_work_summary_json.schema_version = 1.0。"
      - "leader_work_summary_json.action 属于 expected_action_values。"
      - "leader_work_summary_json.file_change.type 属于 new_file 或 major_revision。"
      - "leader_work_summary_json.file_change.target_file 是 string。"
      - "leader_work_summary_json.main_goal 非空。"
      - "leader_work_summary_json.behavior.task_type 存在。"
      - "leader_work_summary_json.behavior.operation 存在。"
      - "leader_work_summary_json.boundary.in_scope 是 string[]。"
      - "leader_work_summary_json.boundary.out_of_scope 是 string[]。"
      - "leader_work_summary_json.dependencies.modules 是 string[]。"
      - "leader_work_summary_json.dependencies.files 是 string[]。"
      - "leader_work_summary_json.memory_note.summary 非空。"
      - "leader_work_summary_json.memory_note.carry_forward 是 string[]。"

    pass_when:
      - "leader_work_summary_json 满足 LeaderWorkSummary strict schema。"
      - "leader_work_summary_json 字段集合与 Leader-Work-Summary-Template.yaml 对齐。"

    repair_when:
      - "leader_work_summary_json 字段值不是 object。"
      - "leader_work_summary_json required 字段缺项。"
      - "leader_work_summary_json 字段集合超出 LeaderWorkSummary schema。"
      - "leader_work_summary_json 字段类型与 LeaderWorkSummary schema 不一致。"

  runtime_action_alignment_check:
    required:
      - "leader_work_summary_json.action 等于 expected_action。"
      - "mode 与 expected_action 符合 mode_action_pairs。"
      - "canonical file_change_type 与 mode_action_pairs 当前分支一致。"
      - "canonical file_change_type 与 canonical action 配对一致。"

    pass_when:
      - "mode、expected_action、canonical action、canonical file_change_type 配对一致。"

    repair_when:
      - "leader_work_summary_json.action 与 expected_action 不一致。"
      - "mode 与 expected_action 不匹配。"
      - "canonical file_change_type 与 canonical action 不匹配。"

  cross_artifact_alignment_check:
    required:
      - "canonical target_file 来自 leader_work_summary_json.file_change.target_file。"
      - "task_packet_md 的 Target File 与 canonical target_file 一致。"
      - "review_intent_pack_md 的 Review Target 与 canonical target_file 一致。"
      - "task_packet_md 的 Expected Action 与 canonical action 一致。"
      - "review_intent_pack_md 的 Expected Action 与 canonical action 一致。"
      - "三个产物表达同一轮任务。"

    pass_when:
      - "Target File / Review Target / canonical target_file 一致。"
      - "两个 Markdown 正文中的 Expected Action 与 canonical action 一致。"
      - "三个产物语义属于同一 target_file。"

    repair_when:
      - "Target File / Review Target / canonical target_file 未对齐。"
      - "Markdown 正文中的 Expected Action 与 canonical action 未对齐。"
      - "三个产物语义分叉。"

commit_permission:
  allow_commit_when:
    - "context_alignment_check pass。"
    - "commit_payload_schema_check pass。"
    - "markdown_gateway_schema_check pass。"
    - "leader_work_summary_schema_check pass。"
    - "runtime_action_alignment_check pass。"
    - "cross_artifact_alignment_check pass。"

  quality_confirm_before_commit:
    - "markdown_template_quality_check pass。"

  stop_when:
    - "任一 required schema check 未通过。"
    - "expected_action 与 leader_work_summary_json.action 未对齐。"
    - "canonical target_file 无法确认。"
    - "三个产物目标文件未对齐。"

after_commit_response_policy:
  if_gateway_accepted_true:
    chat_response:
      - "返回极简成功回执。"
      - "简要说明三个产物已提交。"

  if_gateway_accepted_false:
    chat_response:
      - "报告 Gateway 返回的 error。"
      - "报告 Gateway 返回的 message。"
      - "根据错误所属字段修正后重新执行 Actions Commit Gate。"