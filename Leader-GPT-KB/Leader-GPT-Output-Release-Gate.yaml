system_facts:
  file_identity:
    id: "leader-gpt-output-release-gate"
    name: "Leader-GPT Output Release Gate"
    purpose: "定义 Leader-GPT 在正式发布一轮输出前必须通过的最终自检规则。"
    owner_role: "Leader-GPT"
    use_stage: "after_envelope_before_final_output"

  position_in_chain:
    previous_step: "Leader-GPT-Round-Output-Envelope-Standard.md"
    current_step: "release_gate_check"
    next_step: "final_output"

  scope_boundary:
    owns:
      - "检查三块输出是否完整。"
      - "检查 marker 是否完整且顺序正确。"
      - "检查前两个区块是否为 Markdown。"
      - "检查 Round Meta 是否为合法 JSON。"
      - "检查 Round Meta 是否只包含固定字段。"
      - "检查 Reading Scope 是否使用 R? + D?。"
      - "检查任务包、审查意图包、Round Meta 是否混写。"
      - "检查三个输出区块是否围绕同一个 target_file。"

    does_not_own:
      - "不选择 target_file。"
      - "不生成 KiroPrompt-GPT Task Packet 正文。"
      - "不生成 Review Intent Packet 正文。"
      - "不生成 Round Meta 字段内容。"
      - "不解释项目背景。"
      - "不判断模块边界。"
      - "不替代任何输出模板。"

  required_upstream_files:
    - "Leader-GPT-Round-Output-Envelope-Standard.md"
    - "KiroPrompt-GPT-Task-Packet-Template.md"
    - "Review-Intent-Packet-Template.md"
    - "Round-Meta-Template.md"
    - "reading-layer-quantization-standard.yaml"

release_gate_contract:
  required_blocks:
    order:
      - "kiro_prompt_task_packet"
      - "review_intent_packet"
      - "round_meta"

    markers:
      kiro_prompt_task_packet:
        start: "<<<KIRO_PROMPT_TASK_PACKET_START>>>"
        end: "<<<KIRO_PROMPT_TASK_PACKET_END>>>"
        format: "Markdown"

      review_intent_packet:
        start: "<<<REVIEW_INTENT_PACKET_START>>>"
        end: "<<<REVIEW_INTENT_PACKET_END>>>"
        format: "Markdown"

      round_meta:
        start: "<<<ROUND_META_START>>>"
        end: "<<<ROUND_META_END>>>"
        format: "JSON"

  round_meta_allowed_fields:
    - "round_id"
    - "action"
    - "creator"
    - "output_artifacts"
    - "target_file"
    - "created_at"

  round_meta_fixed_values:
    creator: "Leader-GPT"
    action_allowed_values:
      - "Create"
      - "MajorRevision"
    output_artifacts:
      - type: "kiro_prompt_task_packet"
        recipient: "KiroPrompt-GPT"
      - type: "review_intent_packet"
        recipient: "Review-GPT"

check_groups:
  envelope_check:
    must:
      - "三个强 marker 区块全部存在。"
      - "三个区块顺序与 required_blocks.order 一致。"
      - "每个区块的 start marker 与 end marker 完整。"
      - "marker 拼写与 release_gate_contract.required_blocks.markers 完全一致。"
      - "正式输出不新增第四个 marker 区块。"

    fail_when:
      - "缺失任一区块。"
      - "任一 start marker 或 end marker 缺失。"
      - "marker 拼写错误。"
      - "三个区块顺序错乱。"
      - "出现第四个正式输出区块。"

  kiro_prompt_task_packet_check:
    must:
      - "KiroPrompt-GPT Task Packet 位于第一个区块。"
      - "KiroPrompt-GPT Task Packet 使用 Markdown。"
      - "KiroPrompt-GPT Task Packet 明确本轮唯一 target_file。"
      - "KiroPrompt-GPT Task Packet 明确 file_context。"
      - "Reading Scope 中每个列出的文件都使用 R? + D? 标注。"
      - "Reading Scope 中每个列出的文件都带用途说明。"
      - "Expansion Permission 明确是否允许扩读、触发条件和最多扩读次数。"
      - "Expected Output 聚焦 KiroPrompt-GPT 应生成的输出。"

    must_not:
      - "写 Review-GPT 的审查意图。"
      - "写 Review-GPT 的完整审查制度。"
      - "写 Round Meta JSON。"
      - "解释 KiroPrompt-GPT 内部如何执行 R/D 阅读标准。"
      - "使用“相关文件”“按需阅读”“看情况补读”“必要时参考”等模糊阅读表达替代 R/D 标注。"

    fail_when:
      - "任务包缺少唯一 target_file。"
      - "Reading Scope 中存在未标注 R? + D? 的文件。"
      - "Expansion Permission 使用模糊扩读表达。"
      - "任务包写入 Review-GPT 审查意图或 Round Meta JSON。"
      - "任务包把多个目标文件当作本轮直接工作单位。"

  review_intent_packet_check:
    must:
      - "Review Intent Packet 位于第二个区块。"
      - "Review Intent Packet 使用 Markdown。"
      - "Review Intent Packet 围绕本轮 target_file 表达审查意图。"
      - "Review Intent Packet 明确 Leader Intent。"
      - "Review Intent Packet 明确 Expected Alignment。"
      - "Review Intent Packet 明确 Review Focus。"
      - "Review Intent Packet 明确 Do Not Overreview。"
      - "如果 Optional Reading Scope 列出文件，则每个文件都使用 R? + D? 标注。"

    must_not:
      - "写 KiroPrompt-GPT 的任务执行细节。"
      - "写 prompt-kiro.md 生成步骤。"
      - "写 Round Meta JSON。"
      - "定义 Review-GPT 的完整审查制度。"
      - "默认把同一 Spec 的三层文件全部列为本轮审查目标。"

    fail_when:
      - "审查意图包没有围绕本轮 target_file。"
      - "审查意图包写入 KiroPrompt-GPT 执行细节。"
      - "审查意图包写入 Round Meta JSON。"
      - "Optional Reading Scope 存在未标注 R? + D? 的文件。"
      - "审查意图包把审查意图扩展成完整审查制度。"

  round_meta_check:
    must:
      - "Round Meta 位于第三个区块。"
      - "Round Meta 是合法 JSON。"
      - "Round Meta 只包含 round_meta_allowed_fields 中定义的字段。"
      - "round_id 是数字。"
      - "action 只能是 Create 或 MajorRevision。"
      - "creator 固定为 Leader-GPT。"
      - "output_artifacts 与 round_meta_fixed_values.output_artifacts 完全一致。"
      - "target_file 是单一 string。"
      - "target_file 只记录本轮打算新增或大修的唯一目标文件。"
      - "created_at 使用 ISO 8601 格式。"

    must_not:
      - "添加模板外字段。"
      - "使用 target_files 数组。"
      - "把相关文件、参考文件、阅读文件写入 target_file。"
      - "把 Round Meta 写成 YAML。"
      - "把 Round Meta 写成自然语言解释文本。"
      - "在 Round Meta 中写工作流状态、日志、备注、blocked、current_status、related_files 或 resume_hint。"

    fail_when:
      - "Round Meta 不是合法 JSON。"
      - "Round Meta 出现模板外字段。"
      - "Round Meta 缺少必需字段。"
      - "action 不是 Create 或 MajorRevision。"
      - "creator 不是 Leader-GPT。"
      - "output_artifacts 与固定值不一致。"
      - "target_file 不是单一 string。"
      - "target_file 记录了相关文件、参考文件或阅读文件。"

  cross_block_alignment_check:
    must:
      - "KiroPrompt-GPT Task Packet 的 Target File 与 Round Meta 的 target_file 一致。"
      - "Review Intent Packet 的 Review Target 与 Round Meta 的 target_file 一致。"
      - "Round Meta 的 action 与输入类型和本轮意图一致。"
      - "三个区块都服务同一轮任务。"

    fail_when:
      - "任务包 Target File 与 Round Meta target_file 不一致。"
      - "审查意图包 Review Target 与 Round Meta target_file 不一致。"
      - "Round Meta action 与本轮输入类型冲突。"
      - "三个区块看起来属于不同目标文件。"

  outside_block_check:
    must:
      - "正式输出主要由三个强 marker 区块组成。"
      - "marker 外不写影响任务理解的正文。"

    may:
      - "在用户明确要求解释时，可以在正式任务输出之外另行解释；但解释不得混入 marker 内部。"

    must_not:
      - "在 marker 外写第四类产物。"
      - "在 marker 外写会被下游误认为任务内容的补充说明。"
      - "在 marker 外写与本轮任务无关的背景说明。"

pass_when:
  - "三个强 marker 区块全部存在。"
  - "三个区块顺序正确。"
  - "marker 完整且拼写正确。"
  - "KiroPrompt-GPT Task Packet 是 Markdown。"
  - "Review Intent Packet 是 Markdown。"
  - "Round Meta 是合法 JSON。"
  - "Round Meta 只包含固定字段。"
  - "Round Meta 的 output_artifacts 与固定值一致。"
  - "Round Meta 的 action 只能是 Create 或 MajorRevision。"
  - "Round Meta 的 target_file 是单一目标文件路径。"
  - "Reading Scope 使用 R? + D? 标注。"
  - "任务包、审查意图包、Round Meta 没有混写。"
  - "三个区块围绕同一个 target_file。"

fail_when:
  - "缺失任一区块。"
  - "强 marker 缺失、拼写错误或顺序错乱。"
  - "Round Meta 不是合法 JSON。"
  - "Round Meta 出现模板外字段。"
  - "Round Meta 使用 target_files 数组。"
  - "Round Meta 把相关文件写成目标文件。"
  - "Reading Scope 缺少 R? + D? 标注。"
  - "KiroPrompt-GPT Task Packet 与 Review Intent Packet 内容混写。"
  - "KiroPrompt-GPT Task Packet 或 Review Intent Packet 写入 Round Meta JSON。"
  - "三个区块的 target_file 不一致。"

stop_when_failed:
  - "不得正式输出。"
  - "先定位失败检查项。"
  - "修正不合格区块。"
  - "重新执行 release gate。"

final_output_permission:
  allow_output_when:
    - "pass_when 全部满足。"
    - "fail_when 全部未触发。"

  block_output_when:
    - "任一 fail_when 被触发。"
    - "无法确认 Round Meta JSON 合法。"
    - "无法确认 target_file 唯一。"
    - "无法确认任务包、审查意图包、Round Meta 是否服务同一轮任务。"